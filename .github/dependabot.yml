version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 13 exige PHP 8.4 ; le projet cible PHP 8.3 (CI et Infomaniak).
      # Retirer cette règle le jour où le serveur et la CI passent en PHP 8.4.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
